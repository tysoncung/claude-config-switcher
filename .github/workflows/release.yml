name: Release

# Push a tag like v0.1.0 to build the .vsix and publish a GitHub Release.
# To retry a release that failed partway, run this workflow by hand with that
# tag: steps that already succeeded (release, Marketplace, Open VSX) are skipped.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish again, e.g. v1.2.3. Leave empty to only build."
        required: false
        default: ""

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The tag being released: the pushed tag, or the one given by hand. Empty
      # means a build-only run.
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - name: Check tag name
        if: env.TAG != ''
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $TAG"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache here: a release build should never restore a cache
      # that another workflow could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check tag matches package.json version
        if: env.TAG != ''
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - name: Package extension
        run: pnpm run package

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"

      - name: Create GitHub Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" ./*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes

      - name: Publish to VS Code Marketplace
        if: env.TAG != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set, skipping Marketplace publish"
            exit 0
          fi
          pnpm exec vsce publish --skip-duplicate --packagePath ./*.vsix

      - name: Publish to Open VSX
        if: env.TAG != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set, skipping Open VSX publish"
            exit 0
          fi
          # Only create the namespace when it's missing, so a bad token fails here
          # with Open VSX's own message.
          if ! curl -fsS -o /dev/null https://open-vsx.org/api/tysoncung; then
            pnpm exec ovsx create-namespace tysoncung
          fi
          pnpm exec ovsx publish --skip-duplicate ./*.vsix
